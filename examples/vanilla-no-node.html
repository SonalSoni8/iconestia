<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Thinicons CDN Example</title>
    <style>
      :root {
        --bg: #f4f8ff;
        --fg: #0d1b2f;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: 'Segoe UI', sans-serif;
        background: radial-gradient(circle at 20% 0, #d7ebff, transparent 40%), var(--bg);
        color: var(--fg);
        display: grid;
        place-items: center;
      }

      .card {
        width: min(760px, 92vw);
        border-radius: 18px;
        border: 1px solid #d7e4fb;
        background: rgba(255, 255, 255, 0.82);
        padding: 1.2rem;
        box-shadow: 0 18px 44px rgba(15, 33, 57, 0.14);
      }

      .row {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
        gap: 12px;
        margin-top: 1rem;
      }

      .tile {
        border: 1px solid #d6e1f5;
        border-radius: 12px;
        background: #fff;
        padding: 0.75rem;
        text-align: center;
        font-size: 0.85rem;
      }

      .tile svg {
        width: 24px;
        height: 24px;
        stroke: currentColor;
      }
    </style>
  </head>
  <body>
    <section class="card">
      <h1>Thinicons CDN Example</h1>
      <p>Loads optimized SVG icons directly from jsDelivr.</p>
      <div class="row" id="icons"></div>
    </section>

    <script>
      const iconNames = ['home', 'search', 'wallet', 'settings', 'bell', 'user'];
      const base = 'https://cdn.jsdelivr.net/npm/@thinicons/core@latest/icons/optimized';
      const root = document.querySelector('#icons');

      Promise.all(iconNames.map((name) => fetch(`${base}/${name}.svg`).then((res) => res.text()))).then(
        (svgs) => {
          svgs.forEach((svg, index) => {
            const tile = document.createElement('div');
            tile.className = 'tile';
            tile.innerHTML = `${svg}<div style="margin-top:8px">${iconNames[index]}</div>`;
            root.appendChild(tile);
          });
        },
      );
    </script>
  </body>
</html>
